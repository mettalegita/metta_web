# Decap CMS Configuration for Metta Web
local_backend: true

backend:
  name: github
  repo: mettalegita/metta_web
  branch: main
  base_url: https://www.mettalegita.com
  auth_endpoint: api/auth

# Media folder
media_folder: public/images/uploads
public_folder: /images/uploads

# Site URL
site_url: https://www.mettalegita.com
display_url: https://www.mettalegita.com

# Logo for CMS
logo_url: /images/logo/logo-dark.svg

# Slug settings
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'

# Collections
collections:
  # Hero Section
  - name: hero
    label: Hero Section
    files:
      - name: hero
        label: Hero Section
        file: data/homepage.json
        fields:
          - name: hero
            label: Hero Content
            widget: object
            fields:
              - { label: Hero Image, name: image, widget: image }
              - { label: Title (italic), name: title, widget: string }
              - { label: Subtitle (large), name: subtitle, widget: string }

  # About Section
  - name: about
    label: About Section
    files:
      - name: about
        label: About Section
        file: data/homepage.json
        fields:
          - name: about
            label: About Content
            widget: object
            fields:
              - { label: Description, name: description, widget: text }
              - { label: Email Placeholder, name: emailPlaceholder, widget: string }
              - { label: Button Text, name: buttonText, widget: string }

  # Portfolio Section
  - name: portfolio
    label: Albums & Compositions Section
    files:
      - name: portfolio
        label: Albums & Compositions Section
        file: data/portfolioSection.json
        fields:
          - { label: Italic Title (First part), name: italicTitle, widget: string }
          - { label: Heading Title (Second part), name: headingTitle, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Button Text, name: buttonText, widget: string }
          - { label: Button Link, name: buttonLink, widget: string }

  # Services Section
  - name: services
    label: What I Do Section
    files:
      - name: services
        label: What I Do Section
        file: data/homepage.json
        fields:
          - name: services
            label: Services Content
            widget: object
            fields:
              - { label: Section Title, name: sectionTitle, widget: string }
              - { label: Section Description, name: sectionDescription, widget: text }
              - { label: Button Text, name: buttonText, widget: string }
              - { label: Button Link, name: buttonLink, widget: string }
              - name: items
                label: Service Items
                widget: list
                fields:
                  - { label: ID, name: id, widget: number, value_type: int }
                  - { label: Title, name: title, widget: string }
                  - { label: Subtitle, name: subtitle, widget: string }
                  - {
                      label: Features,
                      name: features,
                      widget: list,
                      field: { label: Feature, name: feature, widget: string },
                    }

  # Performances & Events Section
  - name: events
    label: Performances & Events
    files:
      - name: events
        label: Performances & Events
        file: data/events.json
        fields:
          - { label: Italic Title (First part), name: italicTitle, widget: string }
          - { label: Heading Title (Second part), name: headingTitle, widget: string }
          - { label: Description, name: description, widget: text }
          - name: items
            label: Events
            widget: list
            allow_add: true
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Date, name: date, widget: string }
              - { label: Title, name: title, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: Image (optional), name: image, widget: image, required: false }

  # Image Marquee Section
  - name: imageMarquee
    label: Image Marquee Gallery
    files:
      - name: imageMarquee
        label: Image Marquee Gallery
        file: data/imageMarquee.json
        fields:
          - name: images
            label: Gallery Images
            widget: list
            allow_add: true
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Image, name: image, widget: image }
              - { label: Alt Text, name: alt, widget: string }
              - { label: Link URL (optional), name: link, widget: string, required: false }

  # Blog Section
  - name: blog
    label: Blog Section
    files:
      - name: blog
        label: Blog Section
        file: data/homepage.json
        fields:
          - name: blog
            label: Blog Content
            widget: object
            fields:
              - { label: Section Title, name: sectionTitle, widget: string }
              - { label: Button Text, name: buttonText, widget: string }
              - { label: Button Link, name: buttonLink, widget: string }

  # FAQ Section
  - name: faq
    label: People Asked Us Section
    files:
      - name: faq
        label: People Asked Us Section
        file: data/faqHome.json
        fields:
          - { label: Italic Title (First part), name: italicTitle, widget: string }
          - { label: Heading Title (Second part), name: headingTitle, widget: string }
          - { label: Description, name: description, widget: text }
          - name: faqs
            label: FAQ Items
            widget: list
            allow_add: true
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

  # CTA Section
  - name: cta
    label: Call to Action Section
    files:
      - name: cta
        label: Call to Action Section
        file: data/homepage.json
        fields:
          - name: cta
            label: CTA Content
            widget: object
            fields:
              - { label: Text Before, name: textBefore, widget: string }
              - { label: Text After, name: textAfter, widget: string }
              - { label: Italic Text, name: italicText, widget: string }
              - name: images
                label: CTA Images
                widget: list
                fields:
                  - { label: ID, name: id, widget: string }
                  - { label: Image, name: image, widget: image }

  # Blog Posts
  - name: blogs
    label: Blog Posts
    folder: data/marketing/blog
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Thumbnail Image, name: thumbnail, widget: image, required: true }
      - { label: Feature Image, name: featureImage, widget: image, required: true }
      - { label: Featured Post, name: featured, widget: boolean, default: false }
      - { label: Body, name: body, widget: markdown }

  # Services Pages
  - name: servicesSection
    label: What I Do Section Pages
    folder: data/servicesV2
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Cover Image, name: coverImage, widget: image }
      - { label: Hover Image, name: hoverImage, widget: image }
      - { label: Badge, name: badge, widget: string, default: 'Services details' }
      - { label: Body, name: body, widget: markdown }

  # Global Settings
  - name: settings
    label: Site Settings
    files:
      - name: settings
        label: Site Settings
        file: data/siteSettings.json
        fields:
          - name: site
            label: Site Configuration
            widget: object
            fields:
              - { label: Site Title, name: siteTitle, widget: string }
              - { label: Site Description, name: siteDescription, widget: text }
              - { label: Contact Email, name: contactEmail, widget: string }
              - { label: Phone Number, name: phoneNumber, widget: string }

  - name: generalFaq
    label: General FAQ (Site-wide)
    files:
      - name: generalFaq
        label: General FAQ
        file: data/faq.json
        fields:
          - name: items
            label: FAQ Items
            widget: list
            allow_add: true
            fields:
              - { label: ID, name: id, widget: number, value_type: int }
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

  - name: footer
    label: Footer Navigation
    files:
      - name: footer
        label: Footer Navigation
        file: data/footer.json
        fields:
          - name: footerSections
            label: Footer Sections
            widget: list
            allow_add: true
            collapsed: false
            summary: '{{fields.title}}'
            fields:
              - { label: Section Title, name: title, widget: string }
              - label: Links
                name: links
                widget: list
                summary: '{{fields.label}}'
                fields:
                  - { label: Label, name: label, widget: string }
                  - { label: URL, name: href, widget: string }

  # Portfolio Projects
  - name: caseStudies
    label: Albums & Compositions
    folder: data/portfolio-agency/case-studies
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Thumbnail Image, name: thumbnail, widget: image }
      - { label: Cover Image, name: coverImage, widget: image }
      - { label: Badge, name: badge, widget: string, default: 'Album' }
      - { label: Body, name: body, widget: markdown }
